<!DOCTYPE html>
<html lang="zh-CN" data-theme="macaron">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>流水 · 轻记账</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <script src="../assets/js/theme.js"></script>
</head>
<body class="page-app" data-page="ledger">
  <div class="app-shell">
    <div id="sidebar"></div>

    <div class="app-body">
      <header class="appbar">
        <div class="appbar__title">
          <h1>流水</h1>
          <p class="appbar__sub" id="appbarSub">查看每一笔收支</p>
        </div>
        <div class="appbar__actions">
          <span class="sync-chip" data-sync-chip hidden></span>
          <a class="avatar" id="appbarAvatar" href="settings.html" aria-label="账号与设置">L</a>
        </div>
      </header>

      <main class="app-content">
        <section class="monthbar" aria-label="月份切换">
          <button class="icon-btn" id="prevMonth" type="button" aria-label="上一月">
            <span class="material-symbols-rounded">chevron_left</span>
          </button>
          <span class="monthbar__label num" id="monthText">本月</span>
          <button class="icon-btn" id="nextMonth" type="button" aria-label="下一月">
            <span class="material-symbols-rounded">chevron_right</span>
          </button>
          <div class="monthbar__spacer"></div>
          <button class="btn btn--soft btn--sm" id="backToCurrent" type="button">回到本月</button>
        </section>

        <section class="account-filter" id="accountFilter" aria-label="账户筛选" hidden>
          <span class="account-filter__label">账户</span>
          <select class="select" id="accountSelect">
            <option value="__all__">全部关联账户</option>
          </select>
        </section>

        <section class="hero-card" aria-label="月度概览">
          <div class="hero-card__head">
            <span class="eyebrow">本月结余</span>
            <span class="badge badge--brand" id="balanceRate">—</span>
          </div>
          <p class="hero-card__amount num" id="balanceValue">¥0.00</p>

          <div class="mini-grid">
            <div>
              <span class="mini-grid__label">支出</span>
              <strong class="num" id="expenseValue">¥0.00</strong>
            </div>
            <div>
              <span class="mini-grid__label">收入</span>
              <strong class="num amount-income" id="incomeValue">¥0.00</strong>
            </div>
            <div>
              <span class="mini-grid__label">日均支出</span>
              <strong class="num" id="avgValue">¥0.00</strong>
            </div>
          </div>

          <div class="hero-budget" id="budgetMini" hidden>
            <div class="hero-budget__row">
              <span id="budgetMiniLabel">预算已用</span>
              <span class="num" id="budgetMiniText">—</span>
            </div>
            <div class="progress">
              <div class="progress__bar" id="budgetMiniBar" style="width: 0%"></div>
            </div>
          </div>
        </section>

        <div class="list-toolbar">
          <div class="segmented" id="typeFilter" role="tablist" aria-label="按类型筛选">
            <button class="segmented__item is-active" type="button" data-type="all" role="tab">全部</button>
            <button class="segmented__item" type="button" data-type="expense" role="tab">支出</button>
            <button class="segmented__item" type="button" data-type="income" role="tab">收入</button>
          </div>
          <div class="list-toolbar__actions">
            <button class="icon-btn" id="searchToggle" type="button" aria-label="搜索备注">
              <span class="material-symbols-rounded">search</span>
            </button>
            <button class="icon-btn" id="filterToggle" type="button" aria-label="高级筛选">
              <span class="material-symbols-rounded">tune</span>
            </button>
          </div>
        </div>

        <div class="search-bar" id="searchBar" hidden>
          <span class="input-affix">
            <span class="input-affix__icon"><span class="material-symbols-rounded">search</span></span>
            <input class="input" id="searchInput" type="search" placeholder="搜索备注关键词" autocomplete="off">
          </span>
        </div>

        <div class="filter-tags" id="filterTags" hidden></div>

        <div id="txList"></div>

        <button class="btn btn--ghost btn--block" id="loadMore" type="button" hidden>加载更多</button>

        <p class="ledger-footnote">
          <span class="material-symbols-rounded">lock</span>
          数据保存在当前浏览器，可随时在设置页导出备份
        </p>
      </main>
    </div>

    <div id="tabbar"></div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/ledger.js"></script>
</body>
</html>
