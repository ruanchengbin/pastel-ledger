<!DOCTYPE html>
<html lang="zh-CN" data-theme="macaron">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>记一笔 · 轻记账</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <script src="../assets/js/theme.js"></script>
</head>
<body class="page-app" data-page="record">
  <div class="app-shell">
    <div id="sidebar"></div>

    <div class="app-body">
      <main class="app-content">
        <div class="record-page">
          <div class="record-head">
            <button class="record-head__close" id="closeBtn" type="button" aria-label="关闭">
              <span class="material-symbols-rounded">arrow_back</span>
            </button>
            <div class="record-head__title">
              <h1 id="recordTitle">记一笔</h1>
              <p id="recordSub">支出 · 今天</p>
            </div>
            <button class="btn btn--danger btn--sm" id="deleteBtn" type="button" hidden>
              <span class="material-symbols-rounded btn__icon">delete</span>
              删除
            </button>
          </div>

          <div class="segmented segmented--block record-type" id="typeSwitch" role="tablist" aria-label="收支类型">
            <button class="segmented__item is-active" type="button" data-type="expense" role="tab">
              <span class="material-symbols-rounded">trending_down</span>
              支出
            </button>
            <button class="segmented__item" type="button" data-type="income" role="tab">
              <span class="material-symbols-rounded">trending_up</span>
              收入
            </button>
          </div>

          <div class="record-layout">
            <div>
              <section class="record-amount" aria-label="金额">
                <div class="record-amount__label">
                  <span>金额（CNY）</span>
                  <span id="typeHint">支出</span>
                </div>
                <div class="record-amount__row">
                  <span class="record-amount__currency">¥</span>
                  <span class="record-amount__value is-placeholder" id="amountDisplay">0.00</span>
                  <button class="record-amount__clear" id="clearAmount" type="button" aria-label="清空金额">
                    <span class="material-symbols-rounded">backspace</span>
                  </button>
                </div>
              </section>

              <section class="record-section" aria-label="选择分类">
                <div class="row-between" style="margin-bottom: 12px">
                  <h2 class="t-h3">选择分类</h2>
                  <span class="card__hint" id="selectedCatLabel">未选择</span>
                </div>
                <div class="category-grid" id="categoryGrid"></div>
                <p class="field__hint" id="categoryEmpty" hidden>
                  当前类型还没有可用分类，<a class="link" href="categories.html">去分类管理</a>
                </p>
              </section>

              <section class="record-section" aria-label="日期与备注">
                <div class="record-meta">
                  <div class="record-meta__row">
                    <span class="record-meta__label">
                      <span class="material-symbols-rounded">calendar_today</span>
                      日期
                    </span>
                    <div class="record-meta__control">
                      <input class="input" id="dateInput" type="date">
                    </div>
                  </div>
                  <div class="record-meta__row" style="align-items: flex-start">
                    <span class="record-meta__label">
                      <span class="material-symbols-rounded">edit_note</span>
                      备注
                    </span>
                    <div class="record-meta__control">
                      <input class="input" id="noteInput" type="text" maxlength="50" placeholder="选填，最多 50 字">
                      <div class="note-count" id="noteCount">0/50</div>
                    </div>
                  </div>
                </div>
              </section>
            </div>

            <div class="record-layout__side">
              <div class="keypad keypad--3" id="keypad" aria-label="数字键盘">
                <button class="keypad__key" type="button" data-key="1">1</button>
                <button class="keypad__key" type="button" data-key="2">2</button>
                <button class="keypad__key" type="button" data-key="3">3</button>
                <button class="keypad__key" type="button" data-key="4">4</button>
                <button class="keypad__key" type="button" data-key="5">5</button>
                <button class="keypad__key" type="button" data-key="6">6</button>
                <button class="keypad__key" type="button" data-key="7">7</button>
                <button class="keypad__key" type="button" data-key="8">8</button>
                <button class="keypad__key" type="button" data-key="9">9</button>
                <button class="keypad__key" type="button" data-key=".">.</button>
                <button class="keypad__key" type="button" data-key="0">0</button>
                <button class="keypad__key" type="button" data-action="backspace" aria-label="退格">
                  <span class="material-symbols-rounded">backspace</span>
                </button>
              </div>

              <button class="btn btn--primary btn--block" id="saveBtn" type="button" style="margin-top: 12px; height: 52px" disabled>
                <span class="material-symbols-rounded btn__icon">done</span>
                保存
              </button>

              <label class="record-keep checkbox">
                <input type="checkbox" id="keepAdding">
                <span>继续记下一笔</span>
              </label>

              <p class="keypad__hint">
                <span class="material-symbols-rounded">keyboard</span>
                桌面端可使用数字键，Enter 保存，Esc 关闭
              </p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/record.js"></script>
</body>
</html>
