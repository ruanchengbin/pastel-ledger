<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-primary-container": "#fffcff", "background": "#fdf7ff", "primary": "#6144c5", "inverse-surface": "#322e3f", "surface-container-high": "#ede4fb", "on-secondary-fixed": "#1e0060", "on-tertiary": "#ffffff", "secondary-fixed-dim": "#ccbeff", "surface-container": "#f3eaff", "on-tertiary-fixed": "#002118", "tertiary-container": "#44806d", "on-secondary": "#ffffff", "on-background": "#1d1929", "error": "#ba1a1a", "secondary": "#644abe", "surface-container-lowest": "#ffffff", "on-primary": "#ffffff", "surface-tint": "#6347c7", "on-primary-fixed-variant": "#4b2aae", "outline": "#797585", "on-error": "#ffffff", "surface-variant": "#e7dff5", "inverse-primary": "#cbbeff", "primary-fixed-dim": "#cbbeff", "inverse-on-surface": "#f5eeff", "tertiary-fixed-dim": "#96d3bd", "primary-container": "#7a5fe0", "on-surface-variant": "#484553", "tertiary": "#2a6755", "surface": "#fdf7ff", "on-primary-fixed": "#1e0061", "outline-variant": "#cac4d6", "on-surface": "#1d1929", "on-tertiary-fixed-variant": "#0d503f", "on-secondary-container": "#350e8f", "on-secondary-fixed-variant": "#4b2fa5", "error-container": "#ffdad6", "tertiary-fixed": "#b1efd8", "surface-dim": "#dfd6ed", "surface-container-highest": "#e7dff5", "surface-container-low": "#f8f1ff", "surface-bright": "#fdf7ff", "on-error-container": "#93000a", "secondary-fixed": "#e7deff", "secondary-container": "#9f86fe", "primary-fixed": "#e7deff", "on-tertiary-container": "#f9fffa" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin-mobile": "1rem", "margin": "2rem", "space-sm": "0.5rem", "space-md": "1rem", "gutter": "1.5rem", "gutter-sm": "1rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "space-xl": "2rem" }, fontFamily: { "display-lg-mobile": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"] }, fontSize: { "display-lg-mobile": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }], "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }], "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "headline-lg": ["28px", { lineHeight: "36px", letterSpacing: "-0.015em", fontWeight: "700" }], "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.01em", fontWeight: "600" }], "display-lg": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }], "headline-md": ["22px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.02em", fontWeight: "600" }], "label-lg": ["14px", { lineHeight: "20px", fontWeight: "600" }] } } } }</script></head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"></header><main class="flex flex-col relative w-full pt-14 pb-safe bg-surface px-margin-mobile flex-1"><div class="flex flex-col w-full pb-space-lg select-none">
<!-- Brand Mascot & Header Showcase -->
<div class="flex flex-col items-center text-center mt-space-md mb-space-lg">
<div class="relative w-20 h-20 rounded-full bg-surface-container flex items-center justify-center shadow-sm mb-space-md">
<div class="w-14 h-14 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container shadow-md">
<span class="material-symbols-outlined text-[30px]" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
</div>

</div>
<h2 class="font-headline-md text-headline-md text-on-surface font-semibold tracking-tight">记账本
    </h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs max-w-[260px]">
      输入您的专属账号与密码以继续
    </p>
</div>
<!-- Main Login Card Container -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-sm p-space-lg flex flex-col gap-space-md relative overflow-hidden">
<!-- Account Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="usernameInput">
        账号 / 用户名
      </label>
<div class="relative flex items-center w-full">
<div class="absolute left-3.5 flex items-center pointer-events-none text-primary">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="w-full h-13 pl-11 pr-11 bg-surface-container-low text-on-surface font-body-lg text-body-lg rounded-lg outline-none transition-all placeholder:text-outline" id="usernameInput" placeholder="请输入用户名" type="text" value="pastel_user">
<button aria-label="清空用户名" class="absolute right-2.5 w-8 h-8 rounded-full flex items-center justify-center text-outline hover:text-on-surface active:bg-surface-container transition-colors" id="clearUserBtn" type="button">
<span class="material-symbols-outlined text-[18px]">cancel</span>
</button>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="passwordInput">
        安全密码
      </label>
<div class="relative flex items-center w-full">
<div class="absolute left-3.5 flex items-center pointer-events-none text-primary">
<span class="material-symbols-outlined text-[20px]">key</span>
</div>
<input class="w-full h-13 pl-11 pr-11 bg-surface-container-low text-on-surface font-body-lg text-body-lg rounded-lg outline-none transition-all placeholder:text-outline tracking-wider" id="passwordInput" placeholder="请输入登录密码" type="password" value="pastel•secure">
<button aria-label="显示/隐藏密码" class="absolute right-2.5 w-8 h-8 rounded-full flex items-center justify-center text-outline hover:text-on-surface active:bg-surface-container transition-colors" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordToggleIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Secondary Options: Remember & Forgot -->
<div class="flex items-center justify-between pt-space-xs">
<label class="flex items-center gap-2 cursor-pointer select-none py-1">
<input checked="" class="sr-only peer" id="rememberMeCheckbox" type="checkbox">
<div class="w-5 h-5 rounded-lg bg-surface-container flex items-center justify-center text-transparent peer-checked:bg-primary peer-checked:text-on-primary transition-all shadow-xs">
<span class="material-symbols-outlined text-[15px]">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">记住我</span>
</label>
<button class="font-label-md text-label-md text-primary font-semibold py-1 px-1 rounded-sm active:bg-surface-container transition-colors" id="forgotPwdBtn" type="button">
        找回密码
      </button>
</div>
<!-- Primary Login Button -->
<button class="mt-space-xs w-full h-[52px] bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg rounded-xl flex items-center justify-center gap-space-xs shadow-md active:scale-[0.98] transition-all" id="loginSubmitBtn" type="button">
<span class="">进入系统</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Security & Sandbox Trust Pill -->

<!-- Alternative Entries -->
<div class="flex flex-col items-center gap-space-sm mt-space-lg">
<div class="flex items-center gap-1 font-body-md text-body-md text-on-surface-variant">
<span class="">还没有账号？</span>
<button class="font-label-lg text-label-lg text-primary font-semibold px-1 py-1 rounded-sm" id="registerBtn" type="button">
        立即注册
      </button>
</div>
<button class="flex items-center gap-1.5 px-space-md py-2 rounded-full bg-surface-container-high text-on-secondary-fixed font-label-md text-label-md active:bg-surface-variant transition-colors" id="guestModeBtn" type="button">
<span class="material-symbols-outlined text-[16px]">visibility</span>
<span class="">离线访客体验</span>
</button>
</div>
<!-- Visual Delight & Mini Brand Card -->

<!-- System Version Footer -->
<footer class="mt-space-xl text-center">
<p class="font-label-sm text-label-sm text-outline">
      © 2025 Pastel Ledger · Mindful Personal Finance
    </p>
</footer>
</div>
<script>
  (function() {
    const userField = document.getElementById('usernameInput');
    const clearBtn = document.getElementById('clearUserBtn');
    const pwdField = document.getElementById('passwordInput');
    const togglePwdBtn = document.getElementById('togglePasswordBtn');
    const toggleIcon = document.getElementById('passwordToggleIcon');
    const loginBtn = document.getElementById('loginSubmitBtn');
    const guestBtn = document.getElementById('guestModeBtn');

    if (clearBtn && userField) {
      clearBtn.addEventListener('click', () => {
        userField.value = '';
        userField.focus();
      });
    }

    if (togglePwdBtn && pwdField && toggleIcon) {
      togglePwdBtn.addEventListener('click', () => {
        const isPassword = pwdField.type === 'password';
        pwdField.type = isPassword ? 'text' : 'password';
        toggleIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
      });
    }

    if (loginBtn) {
      loginBtn.addEventListener('click', () => {
        const originalContent = loginBtn.innerHTML;
        loginBtn.disabled = true;
        loginBtn.innerHTML = `
          <span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span>
          <span>正在进入...</span>
        `;
        setTimeout(() => {
          loginBtn.disabled = false;
          loginBtn.innerHTML = `
            <span class="material-symbols-outlined text-[20px]">check_circle</span>
            <span>已成功验证</span>
          `;
          setTimeout(() => {
            loginBtn.innerHTML = originalContent;
          }, 1500);
        }, 800);
      });
    }

    if (guestBtn) {
      guestBtn.addEventListener('click', () => {
        const originalText = guestBtn.innerHTML;
        guestBtn.innerHTML = `
          <span class="material-symbols-outlined text-[16px] animate-spin">progress_activity</span>
          <span>开启沙盒...</span>
        `;
        setTimeout(() => {
          guestBtn.innerHTML = originalText;
        }, 700);
      });
    }
  })();
</script></main>



</body></html>
