<!DOCTYPE html><html lang="en"><head>

<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="web_blank" name="shell-type">

      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    ::-webkit-scrollbar { display: none; }

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#6144c5",
            "secondary-fixed-dim": "#ccbeff",
            "tertiary-fixed-dim": "#96d3bd",
            "outline-variant": "#cac4d6",
            "surface-container-lowest": "#ffffff",
            "on-secondary-fixed-variant": "#4b2fa5",
            "on-secondary-container": "#350e8f",
            "surface-container": "#f3eaff",

            "tertiary-fixed": "#b1efd8",

            "inverse-surface": "#322e3f",
            "on-primary-fixed": "#1e0061",
            "on-tertiary-container": "#f9fffa",
            "surface-tint": "#6347c7",
            "on-secondary-fixed": "#1e0060",
            "surface-dim": "#dfd6ed",
            "on-tertiary-fixed-variant": "#0d503f",
            "primary-container": "#7a5fe0",
            "on-primary-fixed-variant": "#4b2aae",
            "error": "#ba1a1a",
            "primary-fixed-dim": "#cbbeff",
            "on-surface": "#1d1929",
            "surface": "#fdf7ff",
            "surface-bright": "#fdf7ff",
            "on-error-container": "#93000a",
            "secondary": "#644abe",
            "on-primary": "#ffffff",
            "outline": "#797585",
            "on-background": "#1d1929",
            "primary-fixed": "#e7deff",
            "surface-container-high": "#ede4fb",
            "on-tertiary-fixed": "#002118",
            "on-primary-container": "#fffcff",
            "background": "#fdf7ff",
            "error-container": "#ffdad6",
            "on-secondary": "#ffffff",
            "on-surface-variant": "#484553",
            "surface-container-highest": "#e7dff5",
            "secondary-container": "#9f86fe",
            "tertiary-container": "#44806d",
            "surface-variant": "#e7dff5",
            "on-tertiary": "#ffffff",
            "on-error": "#ffffff",
            "secondary-fixed": "#e7deff",
            "surface-container-low": "#f8f1ff"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",

            "xl": "0.75rem",
            "full": "9999px"
          },
          spacing: {
            "space-lg": "1.5rem",
            "margin-mobile": "1rem",
            "margin": "2rem",
            "space-sm": "0.5rem",
            "gutter-sm": "1rem",
            "space-xl": "2rem",

            "space-md": "1rem",

          },
          fontFamily: {
            "body-lg": ["Plus Jakarta Sans"],

            "label-md": ["Plus Jakarta Sans"],

          },
          fontSize: {
            "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
            "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.015em", "fontWeight": "700" }],
            "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "600" }],
            "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
            "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
            "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "600" }],
            "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],

            "display-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]

<body class="bg-background font-body-md text-on-surface antialiased min-h-screen flex flex-col justify-between selection:bg-primary-fixed selection:text-on-primary-fixed relative overflow-x-hidden">
<!-- Minimal Header / Brand Indicator -->
<header class="w-full max-w-[1440px] mx-auto px-margin py-space-lg flex items-center justify-between">
<a class="inline-flex items-center gap-space-sm text-on-surface-variant hover:text-primary transition-colors duration-200 group" data-path="landing-page" href="#">


</a>
<div class="flex items-center gap-space-sm">


</div>
<div class="w-24 flex justify-end">

</div>
</header>
<!-- Main Content: Ultra-focused Floating Card Layout -->
<main class="w-full flex-1 flex items-center justify-center px-margin-mobile md:px-margin py-space-xl relative">
<!-- Atmospheric Ambient Glows -->
<div class="absolute -top-16 left-1/3 -translate-x-1/2 w-[480px] h-[480px] rounded-full bg-primary-fixed/40 blur-3xl pointer-events-none -z-10"></div>
<div class="absolute -bottom-10 right-1/4 w-[420px] h-[420px] rounded-full bg-secondary-fixed/30 blur-3xl pointer-events-none -z-10"></div>
<!-- Centered Floating Glassmorphic Login Card -->
<div class="w-full max-w-[440px] mx-auto">
<div class="p-8 sm:p-10 rounded-2xl bg-surface-container-lowest/90 backdrop-blur-md border border-outline-variant/40 shadow-[0_12px_40px_rgba(97,68,197,0.08)] flex flex-col transition-all duration-200">
<!-- Header Info within Card -->
<div class="flex flex-col items-center text-center mb-8">
<div class="w-12 h-12 rounded-2xl bg-surface-container flex items-center justify-center text-primary mb-4 shadow-sm">
<span class="material-symbols-outlined text-[28px]">lock</span>
</div>
<h1 class="font-headline-lg text-headline-lg font-bold text-on-surface tracking-tight mb-2">记账本</h1>
<p class="font-body-md text-body-md text-on-surface-variant">输入您的专属账号与密码以继续</p>
</div>
<!-- Pure Simple Account + Password Form -->
<form class="flex flex-col gap-5" id="auth-form" onsubmit="event.preventDefault(); handleLogin();">
<!-- Account / Username Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold" for="identifier-input">
              账号
            </label>
<div class="flex items-center rounded-xl bg-surface-container-low border border-transparent focus-within:border-primary/40 focus-within:bg-surface-container-lowest focus-within:ring-4 focus-within:ring-primary/10 transition-all px-space-sm py-1 shadow-sm">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant ml-1 mr-2.5">person</span>
<input autocomplete="username" class="flex-1 py-2 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline outline-none border-none focus:ring-0 p-0" id="identifier-input" name="username" placeholder="用户名 / 手机号 / 邮箱" required="" type="text" value="pastel_user">
<button class="p-1 rounded-full text-outline hover:text-on-surface transition-colors" id="clear-identifier-btn" title="清空输入" type="button">
<span class="material-symbols-outlined text-[18px]">cancel</span>
</button>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold" for="pwd-input">
              密码
            </label>
<div class="flex items-center rounded-xl bg-surface-container-low border border-transparent focus-within:border-primary/40 focus-within:bg-surface-container-lowest focus-within:ring-4 focus-within:ring-primary/10 transition-all px-space-sm py-1 shadow-sm">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant ml-1 mr-2.5">key</span>
<input autocomplete="current-password" class="flex-1 py-2 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline outline-none border-none focus:ring-0 p-0" id="pwd-input" name="password" placeholder="请输入登录密码" required="" type="password" value="••••••••••••">
<button class="p-1 rounded-full text-outline hover:text-on-surface transition-colors" id="toggle-pwd-btn" title="显示或隐藏密码" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Options Row: Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded border-outline-variant text-primary accent-primary focus:ring-primary focus:ring-offset-0 cursor-pointer" id="remember-me" type="checkbox">
<span class="font-label-md text-label-md text-on-surface-variant">记住我</span>
</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-colors" href="#">
              找回密码
            </a>
</div>
<!-- Primary Submit Action Button -->
<button class="w-full mt-2 py-3 px-space-lg rounded-xl bg-primary hover:bg-primary-container active:scale-[0.99] text-on-primary font-headline-sm text-headline-sm font-semibold flex items-center justify-center gap-space-sm transition-all duration-200 shadow-md hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-primary/20" id="submit-login-btn" type="submit">
<span class="">进入系统</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Keyboard Shortcut Hint -->
<div class="pt-2 flex items-center justify-center gap-1 font-body-sm text-body-sm text-on-surface-variant"><span class="">还没有账号？</span><a href="#" class="font-semibold text-primary hover:text-primary-container hover:underline transition-colors ml-1 inline-flex items-center gap-0.5" data-path="register"><span class="">立即注册</span><span class="material-symbols-outlined text-[16px]">chevron_right</span></a></div>
</form>
<!-- Subtle Local Privacy Note Inside Card -->
<div class="mt-6 pt-5 border-t border-outline-variant/30 flex items-center justify-center gap-1.5 text-on-surface-variant font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[15px] text-tertiary">offline_pin</span>
<span class="">数据存储于本地 IndexedDB · 离线可用</span>
</div>
</div>
</div>
</main>
<!-- Clean Footer -->
<footer class="w-full max-w-[1440px] mx-auto px-margin py-space-lg flex flex-col sm:flex-row items-center justify-between gap-space-sm text-on-surface-variant font-body-sm text-body-sm">
<div class="flex items-center gap-space-md">
<span class="text-outline">© 2025 Pastel Ledger Inc.</span>
<a class="hover:text-primary transition-colors" data-path="privacy-policy" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" data-path="terms-of-service" href="#">Terms of Service</a>
</div>
<div class="flex items-center gap-space-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-tertiary">shield_with_heart</span>
<span class="">Mindful &amp; Stress-free Personal Finance</span>
</div>
</footer>
<script>
    const identifierInput = document.getElementById('identifier-input');
    const clearIdBtn = document.getElementById('clear-identifier-btn');
    const togglePwdBtn = document.getElementById('toggle-pwd-btn');
    const pwdInput = document.getElementById('pwd-input');
    const authForm = document.getElementById('auth-form');

    if (clearIdBtn && identifierInput) {
      clearIdBtn.addEventListener('click', () => {
        identifierInput.value = '';
        identifierInput.focus();
      });
    }

    if (togglePwdBtn && pwdInput) {
      togglePwdBtn.addEventListener('click', () => {
        const isPwd = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPwd ? 'text' : 'password');
        togglePwdBtn.querySelector('span').textContent = isPwd ? 'visibility_off' : 'visibility';
      });
    }

    function handleLogin() {
      const btn = document.getElementById('submit-login-btn');
      btn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>进入中...</span>';
      setTimeout(() => {
        alert('登录成功，正在进入 Pastel Ledger 本地记账控制台...');
        btn.innerHTML = '<span>进入系统</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span>';
      }, 600);
    }
  </script>




</body></html>
