<script>
  let currentAmount = 35.0;

  function updateAmountDisplay() {
    const el = document.getElementById('amountDisplay');
    if (el) {
      el.textContent = currentAmount.toFixed(2);
    }
  }

  function addAmount(delta) {
    currentAmount += delta;
    updateAmountDisplay();
  }

  function roundAmount() {
    currentAmount = Math.ceil(currentAmount);
    updateAmountDisplay();
  }

  document.getElementById('clearAmountBtn')?.addEventListener('click', () => {
    currentAmount = 0.0;
    updateAmountDisplay();
  });

  // Switch Expense / Income
  const expenseBtn = document.getElementById('typeExpenseBtn');
  const incomeBtn = document.getElementById('typeIncomeBtn');

  expenseBtn?.addEventListener('click', () => {
    expenseBtn.className = 'flex-1 py-2 rounded-full font-label-lg text-label-lg text-on-error-container bg-error-container shadow-sm transition-all text-center flex items-center justify-center gap-1';
    incomeBtn.className = 'flex-1 py-2 rounded-full font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface transition-all text-center flex items-center justify-center gap-1';
  });

  incomeBtn?.addEventListener('click', () => {
    incomeBtn.className = 'flex-1 py-2 rounded-full font-label-lg text-label-lg text-on-tertiary-fixed bg-tertiary-fixed shadow-sm transition-all text-center flex items-center justify-center gap-1';
    expenseBtn.className = 'flex-1 py-2 rounded-full font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface transition-all text-center flex items-center justify-center gap-1';
  });

  // Category Selection
  function selectCategory(buttonElement, name) {
    document.querySelectorAll('.category-item').forEach(item => {
      item.className = 'category-item flex flex-col items-center justify-center p-2 rounded-xl bg-surface-container-low text-on-surface-variant hover:bg-surface-container transition-all';
      const iconWrap = item.querySelector('div');
      if (iconWrap) {
        iconWrap.className = 'w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface mb-1';
      }
    });

    buttonElement.className = 'category-item flex flex-col items-center justify-center p-2 rounded-xl bg-primary-fixed text-on-primary-fixed shadow-md transform scale-105 transition-all';
    const iconWrap = buttonElement.querySelector('div');
    if (iconWrap) {
      iconWrap.className = 'w-10 h-10 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-sm mb-1';
    }

    const nameLabel = document.getElementById('selectedCategoryName');
    if (nameLabel) {
      nameLabel.textContent = name;
    }
  }

  // Subcategory toggle
  function toggleSubcategory(buttonElement) {
    document.querySelectorAll('.subcat-chip').forEach(chip => {
      chip.className = 'subcat-chip px-3 py-1 rounded-full bg-surface-container-lowest font-label-md text-label-md text-on-surface-variant hover:bg-surface-container shadow-sm transition-colors';
    });
    buttonElement.className = 'subcat-chip px-3 py-1 rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md shadow-sm transition-colors';
  }

  // Append note tags
  function appendTag(tag) {
    const input = document.getElementById('noteInput');
    if (input) {
      if (!input.value.includes(tag)) {
        input.value = (input.value ? input.value + ' ' : '') + tag;
      }
    }
  }

  // Save interaction feedback
  document.getElementById('saveTransactionBtn')?.addEventListener('click', () => {
    const btn = document.getElementById('saveTransactionBtn');
    const keepNext = document.getElementById('keepAddingToggle')?.checked;
    if (btn) {
      btn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>记账成功...</span>';
      setTimeout(() => {
        if (keepNext) {
          btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">done</span><span>保存这笔账目</span>';
          currentAmount = 0.0;
          updateAmountDisplay();
          const noteInput = document.getElementById('noteInput');
          if (noteInput) noteInput.value = '';
        } else {
          window.history.back();
        }
      }, 400);
    }
  });
</script></main></body></html>
