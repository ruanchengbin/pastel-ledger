<script>
  let currentMode = 'code';
  let countdownTimer = null;
  let remainingSeconds = 49;

  function switchLoginMode(mode) {
    currentMode = mode;
    const tabCode = document.getElementById('tab-code');
    const tabPwd = document.getElementById('tab-pwd');
    const tabLocal = document.getElementById('tab-local');

    const secCode = document.getElementById('section-verify-code');
    const secPwd = document.getElementById('section-password');
    const secLocal = document.getElementById('section-local-vault');
    const countryPill = document.getElementById('country-code-pill');
    const accountLabel = document.getElementById('account-label');
    const accountInput = document.getElementById('account-input');
    const btnText = document.getElementById('btn-text');

    // Reset tab active visuals
    [tabCode, tabPwd, tabLocal].forEach(tab => {
      tab.className = "flex-1 py-2 px-2.5 rounded-lg font-label-md text-label-md transition-all duration-200 flex items-center justify-center gap-1 text-on-surface-variant hover:text-on-surface";
    });

    if (mode === 'code') {
      tabCode.className = "flex-1 py-2 px-2.5 rounded-lg font-label-md text-label-md transition-all duration-200 flex items-center justify-center gap-1 bg-surface-container-lowest text-primary shadow-sm";
      secCode.classList.remove('hidden');
      secPwd.classList.add('hidden');
      secLocal.classList.add('hidden');
      countryPill.classList.remove('hidden');
      accountLabel.innerText = "手机号码";
      accountInput.placeholder = "请输入11位手机号";
      accountInput.type = "tel";
      btnText.innerText = "立即进入记账本";
    } else if (mode === 'pwd') {
      tabPwd.className = "flex-1 py-2 px-2.5 rounded-lg font-label-md text-label-md transition-all duration-200 flex items-center justify-center gap-1 bg-surface-container-lowest text-primary shadow-sm";
      secCode.classList.add('hidden');
      secPwd.classList.remove('hidden');
      secLocal.classList.add('hidden');
      countryPill.classList.add('hidden');
      accountLabel.innerText = "账号 / 邮箱 / 手机";
      accountInput.placeholder = "请输入手机号或已绑定的邮箱";
      accountInput.type = "text";
      btnText.innerText = "账号密码登录";
    } else if (mode === 'local') {
      tabLocal.className = "flex-1 py-2 px-2.5 rounded-lg font-label-md text-label-md transition-all duration-200 flex items-center justify-center gap-1 bg-surface-container-lowest text-tertiary shadow-sm";
      secCode.classList.add('hidden');
      secPwd.classList.add('hidden');
      secLocal.classList.remove('hidden');
      countryPill.classList.add('hidden');
      accountLabel.innerText = "账本空间昵称 (可选)";
      accountInput.placeholder = "例如：我的极简日常账本";
      accountInput.type = "text";
      accountInput.value = "极简小猪账本";
      btnText.innerText = "开启无网本地私密体验";
    }
  }

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password-input');
    const eyeIcon = document.getElementById('pwd-eye-icon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      eyeIcon.innerText = 'visibility';
    } else {
      pwdInput.type = 'password';
      eyeIcon.innerText = 'visibility_off';
    }
  }

  function handleSendCode() {
    if (countdownTimer) return;
    remainingSeconds = 60;
    const btn = document.getElementById('send-code-btn');
    const textSpan = document.getElementById('send-code-text');

    btn.disabled = true;
    btn.classList.add('opacity-70');
    textSpan.innerText = `${remainingSeconds}s 重新发送`;

    countdownTimer = setInterval(() => {
      remainingSeconds--;
      if (remainingSeconds <= 0) {
        clearInterval(countdownTimer);
        countdownTimer = null;
        btn.disabled = false;
        btn.classList.remove('opacity-70');
        textSpan.innerText = "获取验证码";
      } else {
        textSpan.innerText = `${remainingSeconds}s 重新发送`;
      }
    }, 1000);
  }
</script></main></body></html>
